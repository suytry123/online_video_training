databaseChangeLog:
  - changeSet:
      id: 001_init_db_structure
      author: soksoytry200@gmail.com
      changes:
        - createTable:
            tableName: categories
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: category_id
                  type: BIGINT
              - column:
                  name: category_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - createSequence:
                   sequenceName: category_id_seq
                   incrementBy: 1
                   startValue: 1
        - createTable:
            tableName: users
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: user_id
                  type: BIGINT
              - column:
                  name: user_name
                  type: VARCHAR(100)
              - column:
                  name: user_password
                  type: VARCHAR(100)
              - column:
                  name: user_email
                  type: VARCHAR(100)
              - column:
                  name: phone_number
                  type: VARCHAR(50)
              - column:
                  name: gender
                  type: VARCHAR(25)
              - column:
                  name: photo
                  type: VARCHAR(50)
              - column:
                  name: join_date
                  type: DATETIME
              - column:
                  name: account_non_expired
                  type: BOOLEAN
              - column:
                  name: account_non_locked
                  type: BOOLEAN
              - column:
                  name: credentials_non_expired
                  type: BOOLEAN
              - column:
                  name: enabled
                  type: BOOLEAN
        - createTable:
            tableName: courses
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: course_id
                  type: BIGINT
              - column:
                  name: course_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: price
                  type: DECIMAL(19,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: courses
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: category_id
            constraintName: fk_courses_categories
        - addForeignKeyConstraint:
            baseTableName: courses
            baseColumnNames: author_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_courses_author
        - createTable:
            tableName: videos
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: video_id
                  type: BIGINT
              - column:
                  name: video_title
                  type: VARCHAR(50)
              - column:
                  name: video_description
                  type: VARCHAR(50)
              - column:
                  name: video_link
                  type: VARCHAR(50)
              - column:
                  name: image_cover
                  type: VARCHAR(50)
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - foreignKeyConstraint:
                  name: fk_videos_courses
                  references: courses(course_id)
        - createTable:
            tableName: permissions
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(50)
        - createTable:
            tableName: roles
            columns:
              - column:
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                  name: id
                  type: BIGINT
              - column:
                  name: name
                  type: VARCHAR(50)
        - createTable:
            tableName: roles_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
              - foreignKeyConstraint:
                  name: fk_roles_permissions_role
                  references: roles(id)
              - column:
                  name: permissions_id
                  type: BIGINT
              - foreignKeyConstraint:
                  name: fk_roles_permissions_permission
                  references: permissions(id)
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
              - foreignKeyConstraint:
                  name: fk_users_roles_users
                  references: users(user_id)
              - column:
                  name: roles_id
                  type: BIGINT
              - foreignKeyConstraint:
                  name: fk_users_roles_role
                  references: roles(id)
        - createTable:
             tableName: enrollments
             columns:
               - column:
                   autoIncrement: true
                   constraints:
                     primaryKey: true
                   name: id
                   type: BIGINT
               - column:
                   name: course_id
                   type: BIGINT
                   constraints:
                     nullable: false
               - column:
                   name: user_id
                   type: BIGINT
                   constraints:
                     nullable: false
               - column:
                   name: status
                   type: VARCHAR(32)
                   constraints:
                     nullable: false
               - column:
                   name: price
                   type: DECIMAL(19,2)
                   defaultValueNumeric: 0
                   constraints:
                     nullable: false
               - column:
                   name: payment_status
                   type: VARCHAR(32)
                   constraints:
                     nullable: true
               - column:
                   name: created_at
                   type: DATETIME
               - column:
                   name: updated_at
                   type: DATETIME        
        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: course_id
            constraintName: fk_enrollments_courses
        - addForeignKeyConstraint:
            baseTableName: enrollments
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_enrollments_users
        - createTable:
            tableName: otp_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: otp
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expire_date
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: used
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: otp_token
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_otp_token_users
        - createTable:
            tableName: email_verifications_token
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: token
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: expire_date
                  type: DATETIME
                  constraints:
                    nullable: false
        - createTable:
            tableName: video_video_link
            columns:
              - column:
                  name: video_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: video_link
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: video_video_link
            baseColumnNames: video_id
            referencedTableName: videos
            referencedColumnNames: video_id
            constraintName: fk_video_video_link_videos