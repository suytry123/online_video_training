databaseChangeLog:
  - changeSet:
      id: 015_course_interaction
      author: soksoytry200@gmail.com
      changes:
        - createTable:
            tableName: course_like
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT

                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT

                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: course_like
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_course_like_user
        - addForeignKeyConstraint:
            baseTableName: course_like
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: course_id
            constraintName: fk_course_like_course
        - addUniqueConstraint:
            tableName: course_like
            columnNames: user_id, course_id
            constraintName: uk_course_like_user_course
        - createTable:
            tableName: course_view
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: course_view
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_course_view_user
        - addForeignKeyConstraint:
            baseTableName: course_view
            baseColumnNames: course_id
            referencedTableName: courses
            referencedColumnNames: course_id
            constraintName: fk_course_view_course
        - addUniqueConstraint:
            tableName: course_view
            columnNames: user_id, course_id
            constraintName: uk_course_view_user_course