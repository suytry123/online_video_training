databaseChangeLog:
  - changeSet:
      id: 015_add_missing_user_fields
      author: soksoytry200@gmail.com
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: education
                  type: VARCHAR(200)
              - column:
                  name: address
                  type: VARCHAR(200)
              - column:
                  name: verification_token
                  type: VARCHAR(255)
              - column:
                  name: is_author
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: bio
                  type: VARCHAR(500)
              - column:
                  name: expertise
                  type: VARCHAR(200)
              - column:
                  name: temp_author_bio
                  type: VARCHAR(500)
              - column:
                  name: temp_expertise
                  type: VARCHAR(200)
              - column:
                  name: temp_gender
                  type: VARCHAR(25)
              - column:
                  name: temp_phone_number
                  type: VARCHAR(50)
              - column:
                  name: temp_education
                  type: VARCHAR(200)
              - column:
                  name: temp_address
                  type: VARCHAR(200)
              - column:
                  name: author_approval_requested
                  type: BOOLEAN
              - column:
                  name: author_approval_status
                  type: VARCHAR(32)
              - column:
                  name: author_approved
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: approve_token
                  type: VARCHAR(255)
              - column:
                  name: reject_token
                  type: VARCHAR(255)
              - column:
                  name: email_verified
                  type: BOOLEAN
                  defaultValueBoolean: false
